{% extends "base.html" %}
{% block title %}Delete plan — Brightloop{% endblock %}
{% block content %}
  <div class="card">
    <h1>Delete plan</h1>
    <p>Are you sure you want to delete “{{ object.name }}”?</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn" type="submit">Yes, delete</button>
      <a class="btn btn--secondary" href="{% url 'catalog:plan-list' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
