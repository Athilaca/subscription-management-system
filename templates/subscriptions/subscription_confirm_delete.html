{% extends "base.html" %}
{% block title %}Delete subscription — Brightloop{% endblock %}
{% block content %}
  <div class="card">
    <h1>Delete subscription</h1>
    <p>Are you sure you want to delete draft {{ object.number }}?</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn" type="submit">Yes, delete</button>
      <a class="btn btn--secondary" href="{% url 'subscriptions:subscription-list' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
