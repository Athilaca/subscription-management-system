{% extends "base.html" %}
{% block title %}Delete quotation template — Brightloop{% endblock %}
{% block content %}
  <div class="card">
    <h1>Delete quotation template</h1>
    <p>Are you sure you want to delete “{{ object.name }}”?</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn" type="submit">Yes, delete</button>
      <a class="btn btn--secondary" href="{% url 'subscriptions:template-list' %}">Cancel</a>
    </form>
  </div>
{% endblock %}
