{% extends "base.html" %}
{% block title %}Create account — Brightloop{% endblock %}
{% block content %}
  <div class="card">
    <h1>Create your account</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Sign up</button>
    </form>
    <p class="auth-links">Already have an account? <a href="{% url 'accounts:login' %}">Sign in</a></p>
  </div>
{% endblock %}
