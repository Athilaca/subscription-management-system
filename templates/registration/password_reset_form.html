{% extends "base.html" %}
{% block title %}Reset password — Brightloop{% endblock %}
{% block content %}
  <div class="card">
    <h1>Reset your password</h1>
    <p class="help-text">Enter your account email and we will send you a reset link.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Send reset link</button>
    </form>
    <p class="auth-links"><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
  </div>
{% endblock %}
