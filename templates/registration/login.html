{% extends "base.html" %}
{% block title %}Sign in — Brightloop{% endblock %}
{% block content %}
  <div class="card">
    <h1>Sign in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn" type="submit">Sign in</button>
    </form>
    <p class="auth-links">
      <a href="{% url 'accounts:password-reset' %}">Forgot your password?</a>
      ·
      <a href="{% url 'accounts:signup' %}">Create an account</a>
    </p>
  </div>
{% endblock %}
