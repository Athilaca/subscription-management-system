{% extends "base.html" %}
{% block title %}Set a new password — Brightloop{% endblock %}
{% block content %}
  <div class="card">
    <h1>Set a new password</h1>
    {% if validlink %}
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Save new password</button>
      </form>
    {% else %}
      <p>This reset link is invalid or has expired.</p>
      <p class="auth-links"><a href="{% url 'accounts:password-reset' %}">Request a new one</a></p>
    {% endif %}
  </div>
{% endblock %}
